<div ng-controller="LoginController">

    <h2>Login</h2>

    <form ng-submit="login()" class="login-form">
        <input type="text" ng-model="loginData.username" placeholder="Username" required>
        <input type="password" ng-model="loginData.password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p class="message" ng-class="{'success': message.includes('Successful'), 'error': message.includes('Failed')}">
        {{ message }}
    </p>

</div>

<style>
    /* Center everything vertically and horizontally */
    body {
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Arial', sans-serif;
        margin: 0;
    }

    div[ng-controller="LoginController"] {
        background-color: #fff;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    h2 {
        color: #0d6efd;
        margin-bottom: 30px;
    }

    .login-form {
        display: flex;
        flex-direction: column;
    }

    .login-form input {
        padding: 12px 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
        transition: border-color 0.3s;
    }

    .login-form input:focus {
        outline: none;
        border-color: #0d6efd;
    }

    .login-form button {
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background-color: #0d6efd;
        color: #fff;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
    }

    .login-form button:hover {
        background-color: #0b5ed7;
        transform: translateY(-2px);
    }

    .message {
        margin-top: 20px;
        font-weight: bold;
    }

    .message.success {
        color: green;
    }

    .message.error {
        color: red;
    }

    /* Make it responsive for small screens */
    @media (max-width: 480px) {
        div[ng-controller="LoginController"] {
            padding: 30px 20px;
        }
        .login-form input, .login-form button {
            font-size: 14px;
            padding: 10px;
        }
    }
</style>
