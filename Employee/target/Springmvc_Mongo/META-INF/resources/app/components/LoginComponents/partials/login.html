
<div>

	<div class="auth-page">
		<div class="card shadow-lg border-0" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">

            <!-- Logo -->
            <div class="text-center mb-3">
                <h3 class="fw-normal">
                    <span class="text-primary fw-bold">My</span>App
                </h3>
            </div>

            <!-- Title -->
            <h4 class="fw-normal mb-1">Sign in</h4>
            <p class="text-muted mb-4">Use your account</p>

            <!-- FORM -->
            <form ng-submit="login()">

                <!-- Username -->
                <div class="form-floating mb-3">
                    <input type="text"
                           class="form-control"
                           id="username"
                           placeholder="Username"
                           ng-model="loginData.username"
                           required>
                    <label for="username">Username</label>
                </div>

                <!-- Password -->
                <div class="form-floating mb-2">
                    <input type="password"
                           class="form-control"
                           id="password"
                           placeholder="Password"
                           ng-model="loginData.password"
                           required>
                    <label for="password">Password</label>
                </div>

                <!-- Forgot -->
                <div class="mb-4">
                    <a ui-sref="email" class="text-primary small text-decoration-none">
                        Forgot password?
                    </a>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-between align-items-center">
                    <a ui-sref="register"
                       class="text-primary fw-medium text-decoration-none">
                        Create account
                    </a>

                    <button type="submit" class="btn btn-primary px-4">
                        Next
                    </button>
                </div>
            </form>

            <!-- MESSAGE -->
            <div style="color:red" ng-if="message"
                 class="alert mt-4 py-2 text-center"
                 ng-class="{
                   'alert-success': message.includes('Successful'),
                   'alert-danger': message.includes('Failed')
                 }">
                {{ message }}
            </div>

        </div>
    </div>
</div>

</div>
