<!DOCTYPE html>
<html lang="en" ng-app="myHelloApp">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- Your main app module -->
    <script src="/Springmvc_Mongo/app/app.js"></script>

    <!-- Home Module -->
    <script src="/Springmvc_Mongo/app/components/HomeComponents/home.module.js"></script>

    <!-- Controllers -->
    <script src="/Springmvc_Mongo/app/components/HomeComponents/controller/HomeController.js"></script>

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        h1 {
            margin-bottom: 30px;
            color: #0d6efd;
        }
        table th {
            background-color: #0d6efd;
            color: white;
        }
        table tr:nth-child(even) {
            background-color: #e9ecef;
        }
        .error-message {
            font-weight: bold;
            color: red;
            margin-bottom: 20px;
        }
        .no-data {
            font-style: italic;
            color: #6c757d;
            margin-top: 15px;
        }
    </style>
</head>
<body ng-controller="HomeController">

    <div class="container">
        <h1 class="text-center">Employee Dashboard</h1>

        <p class="error-message" ng-if="errorMessage">{{ errorMessage }}</p>

        <div class="table-responsive" ng-if="employees.length > 0">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Dept</th>
                        <th>Phone No</th>
                        <th>Address</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="emp in employees">
                        <td>{{ emp.id }}</td>
                        <td>{{ emp.firstName }}</td>
                        <td>{{ emp.lastName }}</td>
                        <td>{{ emp.email }}</td>
                        <td>{{ emp.dept }}</td>
                        <td>{{ emp.phoneNo }}</td>
                        <td>{{ emp.address }}</td>
                        <td>{{ emp.role }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="no-data text-center" ng-if="employees.length === 0 && !errorMessage">
            No employees found.
        </p>
    </div>

    <!-- Bootstrap JS (optional for components like modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
