<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
<meta charset="UTF-8">
<title>Create Account</title>

<link rel="stylesheet" href="app/shared/css/Register/register.css">

</head>
<body ng-controller="RegisterController">

    <div class="register-card">

        <h2>Create your account</h2>
        <p class="subtitle">It’s quick and easy</p>

        <form ng-submit="register()" class="register-form">

            <div class="row">
                <input type="text" ng-model="registerData.firstName" placeholder="First name" required>
                <input type="text" ng-model="registerData.lastName" placeholder="Last name" required>
            </div>

            <input type="text" ng-model="registerData.username" placeholder="Username" required>

            <input type="email" ng-model="registerData.email" placeholder="Email address" required>

            <input type="text" ng-model="registerData.phoneNo" placeholder="Phone number">

            <input type="text" ng-model="registerData.address" placeholder="Address">

            <input type="password" ng-model="registerData.password" placeholder="Password" required>

            <button type="submit">Create Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a ui-sref="login">Sign in</a>
        </p>

        <p class="message">{{ message }}</p>

    </div>

</body>
</html>
