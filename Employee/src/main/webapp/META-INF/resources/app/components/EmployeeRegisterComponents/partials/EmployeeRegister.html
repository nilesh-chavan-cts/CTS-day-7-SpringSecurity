<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>Register Employee</title>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- Your app modules -->
    <script src="/Springmvc_Mongo/app/app.js"></script>
    <script src="/Springmvc_Mongo/app/components/HomeComponents/home.module.js"></script>
    <script src="/Springmvc_Mongo/app/components/HomeComponents/controller/EmployeeRegisterController.js"></script>

    <!-- Styles -->
        <link rel="stylesheet" href="app/shared/css/Employee Register/employeeRegister.css">
</head>
<body ng-controller="EmployeeRegisterController">

<div class="container">
    <h1>Register New Employee</h1>

    <form name="employeeForm" ng-submit="registerEmployee()" novalidate>

        <label for="firstName">First Name</label>
        <input type="text" id="firstName" ng-model="employee.firstName" placeholder="Enter first name" required>

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" ng-model="employee.lastName" placeholder="Enter last name" required>

        <label for="email">Email</label>
        <input type="email" id="email" ng-model="employee.email" placeholder="Enter email" required>

        <label for="phoneNo">Phone Number</label>
        <input type="text" id="phoneNo" ng-model="employee.phoneNo" placeholder="Enter phone number" required>

        <label for="dept">Department</label>
        <select id="dept" ng-model="employee.dept" required>
            <option value="">Select Department</option>
            <option value="IT">IT</option>
            <option value="NON-IT">NON-IT</option>
        </select>

        <label for="role">Role</label>
        <input type="text" id="role" ng-model="employee.role" placeholder="Enter role" required>

        <label for="salary">Salary</label>
        <input type="number" id="salary" ng-model="employee.salary" placeholder="Enter salary" required>

        <label for="gender">Gender</label>
        <select id="gender" ng-model="employee.gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label for="address">Address</label>
        <input type="text" id="address" ng-model="employee.address" placeholder="Enter address" required>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-submit">Register</button>
            <button type="button" class="btn btn-cancel" ng-click="resetForm()">Cancel</button>
        </div>
    </form>
</div>

</body>
</html>
