<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>Sign in</title>

    <link rel="stylesheet" href="app/shared/css/Login/login.css">
</head>

<body ng-controller="LoginController">

    <div class="login-card">

        <!-- Logo / App Name -->
        <div class="logo">
            <span>My</span>App
        </div>

        <h2>Sign in</h2>
        <p class="subtitle">Use your account</p>

        <form ng-submit="login()" class="login-form">

            <div class="input-group">
                <input type="text"
                       ng-model="loginData.username"
                       required>
                <label>Username</label>
            </div>

            <div class="input-group">
                <input type="password"
                       ng-model="loginData.password"
                       required>
                <label>Password</label>
            </div>

            <!-- Forgot password -->
            <div class="links">
                <a ui-sref="email">Forgot password?</a>
            </div>

            <!-- Buttons row -->
            <div class="actions">
                <a ui-sref="register" class="create-account">Create account</a>
                <button type="submit">Next</button>
            </div>

        </form>

        <p class="message"
           ng-if="message"
           ng-class="{
             'success': message.includes('Successful'),
             'error': message.includes('Failed')
           }">
            {{ message }}
        </p>

    </div>

</body>
</html>
